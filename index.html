
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Holographic AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #00ffcc;
      font-family: 'JetBrains Mono', 'Noto Sans Devanagari', monospace;
    }
    /* Cosmic Nebula Background matching the provided photo */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 15% 50%, rgba(220, 20, 60, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 85% 50%, rgba(30, 144, 255, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 80%);
      z-index: -2;
    }
    /* Space/Star Texture Overlay */
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
      opacity: 0.3;
      pointer-events: none;
      z-index: -1;
    }
    canvas {
      display: block;
    }
    .glitch-text {
      text-shadow: 0.05em 0 0 #00ffcc, -0.025em -0.05em 0 #ff00ff,
                   0.025em 0.05em 0 #ffff00;
      animation: glitch 500ms infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 0.05em 0 0 #00ffcc, -0.025em -0.05em 0 #ff00ff, 0.025em 0.05em 0 #ffff00; }
      14% { text-shadow: 0.05em 0 0 #00ffcc, -0.025em -0.05em 0 #ff00ff, 0.025em 0.05em 0 #ffff00; }
      15% { text-shadow: -0.05em -0.025em 0 #00ffcc, 0.025em 0.025em 0 #ff00ff, -0.05em -0.05em 0 #ffff00; }
      49% { text-shadow: -0.05em -0.025em 0 #00ffcc, 0.025em 0.025em 0 #ff00ff, -0.05em -0.05em 0 #ffff00; }
      50% { text-shadow: 0.025em 0.05em 0 #00ffcc, 0.05em 0 0 #ff00ff, 0 -0.05em 0 #ffff00; }
      99% { text-shadow: 0.025em 0.05em 0 #00ffcc, 0.05em 0 0 #ff00ff, 0 -0.05em 0 #ffff00; }
      100% { text-shadow: -0.025em 0 0 #00ffcc, -0.025em -0.025em 0 #ff00ff, -0.025em -0.05em 0 #ffff00; }
    }
    .scanline {
      width: 100%;
      height: 100px;
      z-index: 99;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
      opacity: 0.05;
      position: absolute;
      bottom: 100%;
      animation: scanline 10s linear infinite;
    }
    @keyframes scanline {
      0% { bottom: 100%; }
      100% { bottom: -100px; }
    }
    .grid-bg {
      background-image: 
        linear-gradient(rgba(0, 255, 204, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: #00ffcc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.3);
      border-radius: 10px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "three": "https://esm.sh/three@^0.182.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
